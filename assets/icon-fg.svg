<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- garmanki launcher icon (wariant B, motyw bez tła — zegarek, "tarcza pytanie / odpowiedź"):
       watch face split like a fiszka — "?" above the line, "✓" below.
       Kept within the central ~120px so the Android adaptive mask does not crop it. -->
  <!-- question half -->
  <path d="M42 94 A54 54 0 0 1 150 94 Z" fill="#FFFFFF"/>
  <path d="M83 62 C83 49 109 49 109 62 C109 71 96 71 96 79" fill="none" stroke="#0B3D91" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="96" cy="88" r="3.8" fill="#0B3D91"/>

  <!-- answer half -->
  <path d="M42 98 A54 54 0 0 0 150 98 Z" fill="#BFE0FF"/>
  <path d="M79 122 L92 135 L114 110" fill="none" stroke="#0B3D91" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
